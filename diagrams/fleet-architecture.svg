<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <linearGradient id="gcos" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="780" fill="#f8fafc"/>
  <text x="550" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Echo Maind — Autonomous Agent Fleet</text>
  <text x="550" y="70" text-anchor="middle" font-size="14" fill="#64748b">Self-operating Make → Check → Verify loop on systemd timers</text>

  <!-- COS -->
  <rect x="380" y="96" width="340" height="86" rx="12" fill="url(#gcos)"/>
  <text x="550" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">COS · Orchestrator</text>
  <text x="550" y="150" text-anchor="middle" font-size="12.5" fill="#e0e7ff">authors tickets · routes by type + state</text>
  <text x="550" y="168" text-anchor="middle" font-size="12.5" fill="#e0e7ff">escalates human gates · daily digest</text>

  <!-- arrow COS -> Board -->
  <line x1="550" y1="182" x2="550" y2="228" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="210" font-size="11.5" fill="#64748b">creates / prioritises</text>

  <!-- Kanban board -->
  <rect x="90" y="230" width="920" height="120" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="110" y="256" font-size="14" font-weight="700" fill="#0f172a">2.1 Agent Kanban</text>
  <g font-size="12.5" font-weight="600">
    <rect x="120" y="272" width="140" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="190" y="302" text-anchor="middle" fill="#334155">Backlog</text>

    <rect x="278" y="272" width="150" height="52" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="353" y="302" text-anchor="middle" fill="#1e40af">Active Queue</text>

    <rect x="446" y="272" width="150" height="52" rx="8" fill="#fef9c3" stroke="#fde047"/>
    <text x="521" y="302" text-anchor="middle" fill="#854d0e">In Progress</text>

    <rect x="614" y="272" width="180" height="52" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text x="704" y="302" text-anchor="middle" fill="#166534">Awaiting Verification</text>

    <rect x="812" y="272" width="120" height="52" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="872" y="302" text-anchor="middle" fill="#334155">Done</text>
  </g>
  <text x="334" y="344" font-size="11" fill="#94a3b8">claim top card by position (pos)</text>
  <text x="640" y="344" font-size="11" fill="#94a3b8">evidence + move → verify</text>

  <!-- Makers / Checker -->
  <line x1="353" y1="350" x2="300" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="704" y1="350" x2="780" y2="420" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="424" width="360" height="120" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="300" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Maker Agents 1 &amp; 2</text>
  <text x="300" y="476" text-anchor="middle" font-size="12.5" fill="#1e40af">hourly systemd timers · wake only if a card is claimable</text>
  <text x="300" y="496" text-anchor="middle" font-size="12.5" fill="#334155">claim → execute → leave evidence → move to verify</text>
  <text x="300" y="522" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">never closes its own work</text>

  <rect x="620" y="424" width="360" height="120" rx="12" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="800" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Checker Agent</text>
  <text x="800" y="476" text-anchor="middle" font-size="12.5" fill="#166534">hourly systemd timer · verifies against written DoD</text>
  <text x="800" y="496" text-anchor="middle" font-size="12.5" fill="#334155">passes → Done · fails → bounce · 2 bounces → human</text>
  <text x="800" y="522" text-anchor="middle" font-size="11.5" font-style="italic" fill="#64748b">independent — never the Maker</text>

  <!-- Infrastructure -->
  <line x1="300" y1="544" x2="300" y2="596" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="544" x2="800" y2="596" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="576" font-size="11.5" fill="#64748b">execute</text>
  <text x="810" y="576" font-size="11.5" fill="#64748b">verify</text>

  <rect x="120" y="600" width="860" height="140" rx="12" fill="#0f172a"/>
  <text x="550" y="628" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">Real infrastructure</text>
  <g font-size="12" fill="#cbd5e1">
    <rect x="150" y="644" width="180" height="72" rx="8" fill="#1e293b"/>
    <text x="240" y="672" text-anchor="middle" fill="#e2e8f0" font-weight="600">VivoBook host</text>
    <text x="240" y="692" text-anchor="middle">compute · local LLM</text>

    <rect x="350" y="644" width="160" height="72" rx="8" fill="#1e293b"/>
    <text x="430" y="672" text-anchor="middle" fill="#e2e8f0" font-weight="600">Chromebook</text>
    <text x="430" y="692" text-anchor="middle">edge node</text>

    <rect x="530" y="644" width="150" height="72" rx="8" fill="#1e293b"/>
    <text x="605" y="672" text-anchor="middle" fill="#e2e8f0" font-weight="600">Phone</text>
    <text x="605" y="692" text-anchor="middle">LLM fallback</text>

    <rect x="700" y="644" width="250" height="72" rx="8" fill="#1e293b"/>
    <text x="825" y="672" text-anchor="middle" fill="#e2e8f0" font-weight="600">Hetzner VPS · n8n · Postgres</text>
    <text x="825" y="692" text-anchor="middle">cloud orchestration + state</text>
  </g>
</svg>
